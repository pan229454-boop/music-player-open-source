<script type="text/html" template>
  <link rel="stylesheet" href="{{ layui.setter.paths.core }}css/login.css?v={{ layui.admin.v }}" media="all">
</script>
<div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
</div>

<div class="layadmin-user-login layadmin-user-display-show" id="LAY-user-login" style="display: none;">
  <div class="layadmin-user-login-main">
    <div class="layadmin-user-login-box layadmin-user-login-header">
      <h2>{:config('web.webname')}</h2>
      <p>{:config('web.title')}</p>
    </div>
    <div class="layadmin-user-login-box layadmin-user-login-body layui-form">
      <div class="layui-form-item">
        <label class="layadmin-user-login-icon layui-icon layui-icon-username" for="LAY-user-login-username"></label>
        <input type="text" name="username" id="username" lay-verify="required" placeholder="用户名" class="layui-input">
      </div>
      <div class="layui-form-item">
        <label class="layadmin-user-login-icon layui-icon layui-icon-password" for="LAY-user-login-password"></label>
        <input type="password" name="password" id="password" lay-verify="required" placeholder="密码" class="layui-input">
      </div>
      <div class="layui-form-item" style="margin-bottom: 20px;">
        <input type="checkbox" name="remember" lay-skin="primary" title="记住密码" checked>
      </div>
      <div class="layui-form-item">
        <button class="layui-btn layui-btn-fluid" id="TencentCaptcha" type="button">登 入</button>
      </div>
      <div class="layui-trans layui-form-item layadmin-user-login-other">
        <label>社交账号登入</label>
        <a href="/Admin/QqLogin"><i class="layui-icon layui-icon-login-qq"></i></a>
        <a lay-href="/user/act/reg" class="layadmin-user-jump-change layadmin-link">注册账号</a>
      </div>
    </div>
  </div>
  
  <div class="layui-trans layadmin-user-login-footer">
    <p>© <span id="currentYear"></span> <a href="/" target="_blank">{:config('web.webname')}</a></p>
    <p>
      <span><a lay-href="/user/act/reg">注册</a></span>
      <span><a lay-href="/user/act/find">找回密码</a></span>
      <span><a href="/" target="_blank">首页</a></span>
    </p>
  </div>
</div>

<script src="https://ssl.captcha.qq.com/TCaptcha.js"></script>
<script>
layui.use(['jquery', 'admin', 'form', 'layer'], function () {
    var $ = layui.$,
        form = layui.form,
        layer = layui.layer;

    $('#TencentCaptcha').click(function () {
        var username = $('#username').val();
        var password = $('#password').val();

        // 检查用户名和密码是否为空
        if (!username || !password) {
            layer.msg('用户名和密码不能为空');
            return;
        }

        var captcha = new TencentCaptcha('2046626881', function (res) {
            if (res.ret === 0) {
                var index = layer.load(3);

                $.ajax({
                    type: "POST",
                    dataType: "json",
                    data: {
                        ticket: res.ticket,
                        randstr: res.randstr,
                        username: username,
                        password: password
                    },
                    url: "/LoginAjax/login",
                    success: function (data) {
                        layer.close(index);
                        if (data.code === 0) {
                            layer.msg('登入成功', {
                                offset: '15px',
                                icon: 1,
                                time: 1000
                            }, function () {
                                location.hash = layui.router().search.redirect ? decodeURIComponent(layui.router().search.redirect) : '/';
                            });
                        } else {
                            layer.msg(data.msg);
                        }
                    },
                    error: function () {
                        layer.close(index);
                        layer.msg('网络错误，请重试');
                    }
                });
            } else {
                layer.msg('验证码验证失败，请重试');
            }
        });
        captcha.show();
    });
});
</script>
