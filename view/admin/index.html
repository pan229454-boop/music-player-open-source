<script>
layui.use(['console', 'carousel', 'table'], function(){
  var $ = layui.$
  ,admin = layui.admin
  ,table = layui.table
  ,carousel = layui.carousel
  ,element = layui.element
  ,router = layui.router();

  element.render('collapse');
  
  //监听折叠
  element.on('collapse(component-panel)', function(data){
    layer.msg('展开状态：'+ data.show);
  });
  
  // 清除缓存功能
  $('#qqhc').click(function () {
      layer.confirm('确定要清除所有播放器缓存？', {
          btn: ['确定', '取消'] //按钮
      }, function (index) {
          var index = layer.load(3);
          $.post("/AdminAjax/clearCache", function (data) {
              layer.close(index);
              if (data.code === 0) {
                  layer.msg("清除缓存成功！", {icon: 6, time: 2000});
              } else {
                  layer.alert('清除缓存失败！');
              }
          });
      }, function () {});
  });
  
  async function loadInitialData(){
    try {
      var data = await $.post("/AdminAjax/load");
      updateData(data);
    } catch (e) {
      console.error("加载初始数据失败: ", e);
    }
  }

  function monitorPercent(value) {
    if (typeof value !== 'number' && typeof value !== 'string') return null;
    var text = String(value).trim();
    if (!/^\d+(?:\.\d+)?%?$/.test(text)) return null;
    var number = Number(text.replace(/%$/, ''));
    return Number.isFinite(number) ? Math.min(100, Math.max(0, number)) + '%' : null;
  }

  function updateMonitorBar(id, value) {
    var percent = monitorPercent(value);
    var bar = $('#' + id);
    // Never pass N/A% into Layui's expression evaluator.
    bar.attr('lay-percent', percent || '0%').css('width', percent || '0%');
    bar.find('.layui-progress-text').remove();
    $('#' + id + '-value').text(percent === null ? '暂无数据' : percent);
    bar.attr('title', percent === null ? '监控数据暂不可用' : percent);
  }

  function updateData(data) {
      if (!data || !data.data || (data.code != null && Number(data.code) !== 0)) {
          ['mem', 'cpu', 'load'].forEach(function(id) { updateMonitorBar(id, null); });
          console.warn('监控接口未返回有效数据');
          return;
      }
      updateMonitorBar('mem', data.data.mem);
      updateMonitorBar('cpu', data.data.cpu);
      updateMonitorBar('load', data.data.load);
      $('#cpu').attr("class",data.data.cpus);
      $('#load').attr("class",data.data.loads);
      $('#mem').attr("class",data.data.mems);
      $("#memRealUsed").html(data.data.memRealUsed);
      $("#memTotal").html(data.data.memTotal);
      $('#play').text(data.data.play);
      $('#todayplay').text(data.data.todayplay);
      $('#meplay').text(data.data.meplay);
      $('#metodayplay').text(data.data.metodayplay);
      $('#newplay').text(data.data.newplay);
      $('#newplaytime').text(data.data.newplaytime);
      $('#ssbfb').html(data.data.newplaylist);
      $('#xdls').html(data.data.newloginlist);
  }
  
  async function load(){
    try {
      var data = await $.post("/AdminAjax/load");
      updateData(data);
    } catch (e) {
      console.error("数据加载失败: ", e);
    }
  }

  // 页面进入时同步加载数据
  (async function() {
    await loadInitialData();  // 确保同步加载完成
    loads = setInterval(load, 1000);  // 每3秒刷新一次数据
  })();
});
</script>
