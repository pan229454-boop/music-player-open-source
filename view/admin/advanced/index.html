<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <!-- 创建用户卡片 -->
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header">
                    <i class="layui-icon layui-icon-username"></i> 创建用户
                </div>
                <div class="layui-card-body">
                    <form class="layui-form" lay-filter="createForm">
                        <div class="layui-form-item">
                            <label class="layui-form-label">用户名</label>
                            <div class="layui-input-block">
                                <input type="text" name="username" lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">密码</label>
                            <div class="layui-input-block">
                                <input type="password" name="password" lay-verify="required|length[6,30]" placeholder="请输入密码（6-30位）" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">确认密码</label>
                            <div class="layui-input-block">
                                <input type="password" name="confirm_password" lay-verify="required" placeholder="请再次输入密码" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">QQ号码</label>
                            <div class="layui-input-block">
                                <input type="text" name="qq" placeholder="请输入QQ号码（选填）" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">邮箱</label>
                            <div class="layui-input-block">
                                <input type="text" name="mail" placeholder="请输入邮箱（选填）" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">用户类型</label>
                            <div class="layui-input-block">
                                <select name="power">
                                    <option value="2">免费版</option>
                                    <option value="1">付费版</option>
                                    <option value="0">管理员</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">播放器额度</label>
                            <div class="layui-input-block">
                                <input type="number" name="pie" value="0" placeholder="请输入播放器额度" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button class="layui-btn" lay-submit lay-filter="submitCreate">立即创建</button>
                                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
layui.use(['form', 'layer'], function(){
    var form = layui.form;
    var layer = layui.layer;
    
    form.on('submit(submitCreate)', function(data){
        var field = data.field;
        
        // 验证密码一致性
        if(field.password !== field.confirm_password){
            layer.msg('两次密码输入不一致', {icon: 2});
            return false;
        }
        
        // 发送请求
        $.post('/Advanced/createUser', field, function(res){
            if(res.status === 'success'){
                layer.msg('用户创建成功', {icon: 1}, function(){
                    // 清空表单
                    form.val('createForm', {
                        'username': '',
                        'password': '',
                        'confirm_password': '',
                        'qq': '',
                        'mail': '',
                        'power': '2',
                        'pie': '0'
                    });
                });
            } else {
                layer.msg(res.message || '创建失败', {icon: 2});
            }
        });
        
        return false;
    });
});
</script>
