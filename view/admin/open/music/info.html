<script>
    layui.use(['jquery'], function() {
        var $ = layui.jquery;

        // 获取用户信息
        $.getJSON('/AdminAjax/userInfo', function(res) {
            if (res.code === 0 && res.data) {
                var token = res.data.token2;
               var apiUrl = `{:get_domain()}music/info?token=${token}&type=qq&songId=003RnE490CEC1F`;
             //  var apiUrl = `{:get_domain()}favicon?url=https://music.qsdurl.cn`;
                
                $('#token-example').text(token);
                $('#example-url').attr('href', apiUrl).text(apiUrl);
                $('#api-url').attr('data-clipboard-text', apiUrl);
            } else {
                $('#token-example').text('获取 token 失败');
            }
        }).fail(function() {
            $('#token-example').text('请求失败');
        });
    });

    function copyToClipboard(element) {
        var range, selection;
        if (document.createRange) {
            range = document.createRange();
            range.selectNode(document.querySelector(element));
            selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('copy');
            selection.removeAllRanges();
        }
    }

    var clipboard = new ClipboardJS('.url');
    clipboard.on('success', function(e) {
        layer.msg("复制成功，请粘贴使用！", {icon: 1});
        e.clearSelection();
    });
    clipboard.on('error', function(e) {
        layer.msg("复制失败，请手动复制！", {icon: 2});
    });
</script>
