<div class="layui-col-md6">
    <div class="layui-card">
        <div class="layui-card-header">修改密码</div>
        <div class="layui-card-body">
            <div class="pass-form">
                <div class="layui-form layui-form-pane">
                    <form class="layui-form form-container" method="post">
                        <div class="layui-form-item">
                            <label class="layui-form-label">旧密码</label>
                            <div class="layui-input-inline">
                                <input type="password" id="outpass" name="outpass" required="" lay-verify="required" placeholder="请输入之前的密码" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">新密码</label>
                            <div class="layui-input-inline">
                                <input type="password" id="password" name="password" required="" lay-verify="required" placeholder="请输入新的密码" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">确认密码</label>
                            <div class="layui-input-inline">
                                <input type="password" id="chkPwd" name="chkPwd" required="" lay-verify="required" placeholder="请再输入一次密码" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button class="layui-btn" id="submit" type="submit" lay-submit="" lay-filter="updPwd">立即修改</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    layui.use(['admin', 'form', 'colorpicker'], function () {
        var $ = layui.jquery,
            form = layui.form,
            layer = layui.layer;

        form.on('submit(updPwd)', function (data) {
            var outpass = $("#outpass").val();
            var password = $("#password").val();
            var chkPwd = $("#chkPwd").val();

            if (password !== chkPwd) {
                layer.msg("两次密码输入不一致！");
                return false;
            }
            layer.confirm('确定要修改新密码为：' + password, {
                btn: ['确定', '取消'] //按钮
            }, function (index) {
                var index = layer.load(3);
                $.post("/AdminAjax/password", {
                    outpass: outpass,
                    password: password
                }, function (data) {
                    layer.close(index);
                    layer.open({
                        content: data.message ? data.message : '操作失败！',
                        title: '修改成功',
                        btn: ['确认'],
                        yes: function (index, layero) {
                            location.reload();
                        },
                        cancel: function () {
                            location.reload();
                        }
                    });
                });
            }, function () {
            });
            return false;
        });
    });
</script>
